; Optional example. Leave config.ini absent to use the first-run wizard.
[general]
exit-with-vrchat = false
; Use the HTTP or mixed port of your running proxy client, without http://.
; 7890 is an example; replace it with your own local port.
proxy = 127.0.0.1:7890
debug-fetch = false

[ytdlp]
; Export your own cookies locally if YouTube requires login.
cookies-txt =
cookies-from-browser =
; Original source quality, no re-encoding. First playback waits for a seekable MP4 cache.
; Use lossless-compatible for existing H.264/AAC streams (may be lower quality).
stream-mode = lossless
ffmpeg-path = ./ffmpeg.exe
cache-dir = ./cache
cache-max-gb = 8
prepare-timeout-minutes = 15
keep-config = false
