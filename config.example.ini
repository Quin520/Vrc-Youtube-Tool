; Optional example. Leave config.ini absent to use the first-run wizard.
[general]
exit-with-vrchat = false
; Use the HTTP or mixed port of your running proxy client, without http://.
; 7897 is an example; replace it with your own local port.
proxy = 127.0.0.1:7897
debug-fetch = false

[ytdlp]
; Export your own cookies locally if YouTube requires login.
cookies-txt =
cookies-from-browser =
stream-mode = mp4
keep-config = false
